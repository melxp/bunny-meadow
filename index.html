<!doctype html>
<html lang="en" data-theme="meadow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bunny Meadow</title>
  <meta name="description" content="A peaceful bunny-meadow Pomodoro timer and study tracker.">
  <meta name="theme-color" content="#b7d9ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bunny Meadow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="scene" class="scene" aria-hidden="true"></div>
  <div id="app"></div>

  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <svg class="loader-bunny" viewBox="0 0 64 50" aria-hidden="true">
        <circle cx="9.5" cy="30" r="5.2" fill="#fff"/>
        <ellipse cx="25" cy="32" rx="16" ry="12.5" fill="#fffdf8"/>
        <ellipse cx="18" cy="41" rx="9" ry="4.2" fill="#ebe3d6"/>
        <ellipse cx="38" cy="10" rx="3.8" ry="10.5" transform="rotate(-18 38 10)" fill="#fffdf8"/>
        <ellipse cx="38" cy="11" rx="1.7" ry="7.5" transform="rotate(-18 38 11)" fill="#f6c9cf"/>
        <ellipse cx="43.5" cy="10" rx="3.6" ry="10" transform="rotate(4 43.5 10)" fill="#fffdf8"/>
        <ellipse cx="43" cy="25" rx="11" ry="9.5" fill="#fffdf8"/>
        <ellipse cx="47" cy="23" rx="1.5" ry="1.8" fill="#3d3530"/>
        <ellipse cx="53.4" cy="25.4" rx="1.3" ry="1" fill="#e89aa6"/>
      </svg>
      <div class="loader-ground"></div>
      <p>Tidying the meadow…</p>
    </div>
  </div>
  <noscript><p style="position:relative;z-index:5;padding:2rem;font-family:sans-serif">Bunny Meadow needs JavaScript to run.</p></noscript>
</body>
</html>
